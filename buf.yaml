version: v2
modules:
  - path: internal/proto
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
  ignore_only:
    # Mirrors the public Swagger petstore API, so its names follow that API.
    ENUM_VALUE_PREFIX:
      - internal/proto/io/swagger/petstore
    ENUM_VALUE_UPPER_SNAKE_CASE:
      - internal/proto/io/swagger/petstore
    ENUM_ZERO_VALUE_SUFFIX:
      - internal/proto/io/swagger/petstore
    RPC_REQUEST_STANDARD_NAME:
      - internal/proto/io/swagger/petstore
breaking:
  use:
    - WIRE_JSON
